<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Manager</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #198754);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 1.2s ease-in-out;
        }
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            background-color: #ffffff;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: scale(1);
        }
        h3 {
            font-weight: 700;
            color: #0d6efd;
        }
        .output {
            min-height: 60px;
            padding: 12px;
            border-radius: 8px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            white-space: pre-wrap;
            transition: all 0.3s ease;
        }
        .btn-lg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
            transition: transform 0.2s ease;
        }
        .btn-lg:hover {
            transform: translateY(-2px);
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
    </style>
</head>
<body>

<div class="card">
    <h3 class="text-center mb-4"><i class="bi bi-shield-lock-fill"></i> Password Manager</h3>

    <div class="mb-3">
        <input type="text" id="site" class="form-control" placeholder="🌐 Website/App Name">
    </div>
    <div class="mb-3">
        <input type="text" id="username" class="form-control" placeholder="👤 Username/Email">
    </div>
    <div class="mb-3">
        <input type="password" id="password" class="form-control" placeholder="🔑 Password">
    </div>

    <div class="d-grid gap-2 mb-3">
        <button class="btn btn-success btn-lg" onclick="addPassword()">
            <i class="bi bi-plus-circle"></i> Add Password
        </button>
        <button class="btn btn-primary btn-lg" onclick="viewPassword()">
            <i class="bi bi-eye-fill"></i> View Password
        </button>
    </div>

    <div class="output" id="output">✨ Output will appear here...</div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
async function addPassword() {
    let site = document.getElementById("site").value;
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if(!site || !username || !password) {
        document.getElementById("output").innerText = "⚠️ Please fill all fields.";
        return;
    }

    let response = await fetch("/add", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({site, username, password})
    });

    let result = await response.text();
    document.getElementById("output").innerText = "✅ " + result;
}

async function viewPassword() {
    let site = document.getElementById("site").value;

    if(!site) {
        document.getElementById("output").innerText = "⚠️ Please enter a site name.";
        return;
    }

    let response = await fetch(`/view?site=${site}`);
    let result = await response.text();
    document.getElementById("output").innerText = "🔍 " + result;
}
</script>

</body>
</html>
